name: CI

on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/**"]
  pull_request:
    paths: ["native/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev nasm pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - name: Run tests
        run: cargo test --locked
