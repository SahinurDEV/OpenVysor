[package]
name = "openvysor-native"
version = "0.3.1"
description = "Open-source Android mirroring and control for Windows, macOS and Linux"
license = "Apache-2.0"
repository = "https://github.com/SahinurDEV/OpenVysor"
homepage = "https://sahinurdev.github.io/OpenVysor/"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
env_logger = { version = "0.11.11", default-features = false }
getrandom = "0.4.3"
log = "0.4.35"
mp4 = "0.14.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[target.'cfg(not(windows))'.dependencies]
openh264 = "0.9.9"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.9.0"
tray-icon = "0.26.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
